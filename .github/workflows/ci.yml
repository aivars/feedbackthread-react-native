name: SDK checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack
      # The tarball changes when source or packaged docs change. Refresh only
      # this local package reference before the lockfile-based consumer install.
      - run: npm install --package-lock-only --ignore-scripts ../feedbackthread-react-native-0.1.0-beta.3.tgz
        working-directory: example
      - run: npm ci
        working-directory: example
      - run: npx tsc --noEmit
        working-directory: example
      - run: npx expo install --check
        working-directory: example
      - run: npx expo export --platform ios --platform android
        working-directory: example
